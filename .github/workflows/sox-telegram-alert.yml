name: SOX Morning Alert and Post-Close Evaluation

on:
  # GitHub Actions cron은 UTC 기준입니다.
  # 00:30 UTC = KST 09:30: 아침 예측
  # 06:45 UTC = KST 15:45: 종가 확인·사후평가
  schedule:
    - cron: "30 0 * * 2-5"
    - cron: "45 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning-alert:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 0 * * 2-5'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MODEL_WINDOW: "504"
      DATA_RETRIES: "10"
      RETRY_SECONDS: "60"
      OUTPUT_DIR: "output"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run morning prediction and send Telegram
        run: python sox_telegram_alert.py
      - name: Save prediction for post-close evaluation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "Save morning prediction [skip ci]"
          git push

      - name: Upload morning result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sox-morning-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 14

  post-close-evaluation:
    if: github.event_name == 'schedule' && github.event.schedule == '45 6 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Seoul
      OUTPUT_DIR: "output"
      EVAL_DIR: "evaluation"
    steps:
      - name: Checkout latest prediction files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run post-close evaluation
        run: python sox_post_close_evaluation.py

      - name: Save evaluation history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/
          git diff --cached --quiet || git commit -m "Record post-close evaluation [skip ci]"
          git push

      - name: Upload evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sox-evaluation-${{ github.run_id }}
          path: evaluation/
          if-no-files-found: ignore
          retention-days: 90
        
